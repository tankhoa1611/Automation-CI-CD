name: Playwright tests + GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "00 14 * * *" # 14:00 UTC = 21:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep node_modules between runs on your laptop

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages (only if lock file changed)
        shell: powershell
        run: |
          $hash = (Get-FileHash package-lock.json).Hash
          $mark = "node_modules\.lock-hash"
          if (!(Test-Path $mark) -or (Get-Content $mark) -ne $hash) {
            npm ci
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Set-Content $mark $hash
          } else { Write-Host "package-lock.json unchanged - skipping npm ci" }

      - name: Install Chromium (only if missing)
        run: if not exist "%LOCALAPPDATA%\ms-playwright\chromium-*" npx playwright install chromium

      - name: Clean old results
        run: if exist test-results rmdir /s /q test-results & if exist playwright-report rmdir /s /q playwright-report

      - name: Run tests
        run: npx playwright test --headed --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}