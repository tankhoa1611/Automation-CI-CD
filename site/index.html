<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Automation Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" data-testid="username" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" />
      <button type="submit" data-testid="login-button">Login</button>
      <p id="error" class="error" data-testid="error" role="alert" hidden></p>
    </form>
    <p class="hint">Demo account: <code>admin</code> / <code>admin123</code></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
